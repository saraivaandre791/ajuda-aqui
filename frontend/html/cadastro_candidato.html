<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato</title>
    <!-- Importa o arquivo CSS para estilizar a página -->
    <link rel="stylesheet" href="../css/arena.css">

    <!-- Define o ícone (favicon) da aba do navegador -->
    <link rel="shortcut icon" type="image/svg" href="../static/abobora.ico"/>
</head>
<body>
    <h2>Cadastro de Candidato</h2>

    <!-- Formulário de cadastro que envia os dados para o backend -->
    <!-- action: arquivo PHP que vai processar os dados -->
    <!-- method: POST (envia os dados de forma segura, sem aparecer na URL) -->
    <form action="../../backend/cadastro_candidato.php" method="POST">

        <!-- Campos de dados pessoais -->
         <label for="nome_candidato">Nome completo:</label>
        <input type="text" name="nome_candidato" placeholder="Nome completo" required><br><br>

        <label for="login">Usuário</label>
        <input type="text" name="login" placeholder="Usuário" required><br><br>

        <label for="senha">Senha</label>
        <input type="password" name="senha" placeholder="Senha" required><br>

         <!-- Seção de contato -->
        <h3>Contato</h3>

        <label for="telefone">Telefone</label>
        <input type="text" name="telefone" placeholder="Telefone" required><br><br>

        <label for="email">Email</label>
        <input type="email" name="email" placeholder="Email" required><br>

        <!-- Seção de endereço -->
        <h3>Endereço</h3>

        <label for="rua">Rua</label>
        <input type="text" name="rua" placeholder="Rua" required><br><br>

         <label for="numero">Número</label>
        <input type="text" name="numero" placeholder="Número" required><br><br>

        <Label for="cidade">Cidade</Label>
        <input type="text" name="cidade" placeholder="Cidade" required><br><br>

        <label for="estado">Estado</label>
        <input type="text" name="estado" placeholder="Estado" required><br><br>

        <label for="cep">CEP</label>
        <input type="text" name="cep" placeholder="CEP" required><br>

        <br>
        <br>

        <!-- Botão para enviar o formulário -->
        <button type="submit">Cadastrar</button>
    </form>

    
</body>
</html>
