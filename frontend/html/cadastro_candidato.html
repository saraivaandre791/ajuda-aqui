<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Candidato</title>
    <link rel="stylesheet" href="../css/arena.css">
    <link rel="shortcut icon" type="image/svg" href="../static/abobora.ico"/>
</head>
<body>
    <h2>Cadastro de Candidato</h2>
    <form action="../../backend/cadastro_candidato.php" method="POST">
        <input type="text" name="nome_candidato" placeholder="Nome completo" required><br>
        <input type="text" name="login" placeholder="Usuário" required><br>
        <input type="password" name="senha" placeholder="Senha" required><br>

        <h3>Contato</h3>
        <input type="text" name="telefone" placeholder="Telefone" required><br>
        <input type="email" name="email" placeholder="Email" required><br>

        <h3>Endereço</h3>
        <input type="text" name="rua" placeholder="Rua" required><br>
        <input type="text" name="numero" placeholder="Número" required><br>
        <input type="text" name="cidade" placeholder="Cidade" required><br>
        <input type="text" name="estado" placeholder="Estado" required><br>
        <input type="text" name="cep" placeholder="CEP" required><br>

        <button type="submit">Cadastrar</button>
    </form>

    
</body>
</html>
