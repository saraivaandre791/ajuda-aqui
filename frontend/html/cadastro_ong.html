<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AjudAqui</title>
    <link rel="stylesheet" href="../css/arena.css">
    <link rel="shortcut icon" type="image/svg" href="../static/abobora.ico"/>
</head>
<body class="arena-page">
    <main class="arena-card arena-card--wide arena-card--form" role="main">
        <div class="arena-brand">
            <img src="../logo/LOGO.jpg" alt="AjudAqui" class="arena-logo-sm" width="140">
        </div>
        <h2>Cadastro de ONG</h2>

        <form action="../../backend/cadastro_ong.php" method="POST">
            <label for="login">Usuário</label>
            <input type="text" id="login" name="login" placeholder="Usuário" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>

            <label for="nome_ong">Nome da ONG</label>
            <input type="text" id="nome_ong" name="nome_ong" placeholder="Nome da ONG" required>

            <label for="cnpj">CNPJ da ONG</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ da ONG" required>

            <label for="atuacao">Área de atuação</label>
            <textarea id="atuacao" name="atuacao" rows="4" placeholder="Descreva brevemente o que sua ONG faz..."></textarea>

            <h3>Contato</h3>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="Telefone" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="E-mail" required>

            <h3>Endereço</h3>

            <label for="rua">Rua</label>
            <input type="text" id="rua" name="rua" placeholder="Rua" required>

            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" placeholder="Número" required>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade" required>

            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado" placeholder="Estado" required>

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="CEP" required>

            <div class="arena-actions">
                <button type="submit">Cadastrar</button>
            </div>
        </form>
    </main>
</body>
</html>
