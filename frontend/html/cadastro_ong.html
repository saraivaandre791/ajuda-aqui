<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro ONG</title>
    <link rel="stylesheet" href="../css/arena.css">
    <link rel="shortcut icon" type="image/svg" href="../static/abobora.ico"/>
</head>
<body>
    <h2>Cadastro de ONG</h2>
    <form action="../../backend/cadastro_ong.php" method="POST">

         <label for="login">Usuário</label>
        <input type="text" name="login" placeholder="Usuário" required><br><br>

        <label for="senha">Senha</label>
        <input type="password" name="senha" placeholder="Senha" required><br><br>

        <label for="nome_ong">Nome da ONG</label>
        <input type="text" name="nome_ong" placeholder="Nome da ONG" required><br><br>

        <label for="cnpj">CNPJ da ONG</label>
        <input type="text" name="cnpj" placeholder="CNPJ da ONG" required><br><br>

        <label for="atuacao">Descreva brevemente a Área de Atuação</label><br>
        <textarea id="atuacao" name="atuacao" rows="4" cols="50" 
          placeholder="Descreva brevemente o que sua ONG faz...">
        </textarea><br><br>

       

<h3>Contato</h3>
<label for="telefone">Telefone</label>
<input type="text" name="telefone" placeholder="Telefone" required><br><br>

<label for="email">Email</label>
<input type="email" name="email" placeholder="Email" required><br><br>


<h3>Endereço</h3>

<label for="rua">Rua</label>
<input type="text" name="rua" placeholder="Rua" required><br><br>

<label for="numero">Número</label>
<input type="text" name="numero" placeholder="Número" required><br><br>

<label for="cidade">Cidade</label>
<input type="text" name="cidade" placeholder="Cidade" required><br><br>

<label for="estado">Estado</label>
<input type="text" name="estado" placeholder="Estado" required><br><br>

<label for="cep">CEP</label>
<input type="text" name="cep" placeholder="CEP" required><br>

<br>
<br>

  <button type="submit">Cadastrar</button>
</form>

    
</body>
</html>
