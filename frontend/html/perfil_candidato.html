<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"> <!-- Define o padrão de caracteres como UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta a página para ser responsiva em dispositivos móveis -->
    <title>Perfil do Candidato</title> <!-- Título da aba do navegador -->
    <link rel="stylesheet" href="../css/arena.css"> <!-- Importa o CSS para estilização -->
</head>
<body>
    <h2>Perfil Candidato</h2> <!-- Cabeçalho principal da página -->

    <!-- Formulário para edição dos dados do candidato -->
    <!-- O action aponta para atualizar_candidato.php, que processa as alterações -->
    <!-- O método POST garante que os dados não fiquem visíveis na URL -->
    <form action="atualizar_candidato.php" method="POST">
        <!-- Campo oculto que guarda o ID do candidato -->
        <input type="hidden" name="id" value="<?php echo $id; ?>">

        <!-- Campos preenchidos com os dados atuais do candidato -->
        Nome: <input type="text" name="nome_candidato" value="<?php echo $row['nome_candidato']; ?>"><br>
        Login: <input type="text" name="login" value="<?php echo $row['login']; ?>"><br>
        Telefone: <input type="text" name="telefone" value="<?php echo $row['telefone']; ?>"><br>
        Email: <input type="email" name="email" value="<?php echo $row['email']; ?>"><br>
        Rua: <input type="text" name="rua" value="<?php echo $row['rua']; ?>"><br>
        Número: <input type="text" name="numero" value="<?php echo $row['numero']; ?>"><br>
        Cidade: <input type="text" name="cidade" value="<?php echo $row['cidade']; ?>"><br>
        Estado: <input type="text" name="estado" value="<?php echo $row['estado']; ?>"><br>
        CEP: <input type="text" name="cep" value="<?php echo $row['cep']; ?>"><br>

        <!-- Botão que envia o formulário para salvar as alterações -->
        <button type="submit">Salvar alterações</button>
    </form>
    
</body>
</html>
