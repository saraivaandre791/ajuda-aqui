<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AjudAqui</title>
    <link rel="stylesheet" href="../css/arena.css">
    <link rel="shortcut icon" type="image/svg" href="../static/abobora.ico"/>
</head>
<body class="arena-page">
    <main class="arena-card arena-card--wide arena-card--form" role="main">
        <div class="arena-brand">
            <img src="../logo/LOGO.jpg" alt="AjudAqui" class="arena-logo-sm" width="140">
        </div>
        <h2>Editar dados do candidato</h2>

        <form action="../../backend/editar_candidato.php" method="POST">
            <label for="nome_candidato">Nome</label>
            <input type="text" id="nome_candidato" name="nome_candidato" required>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email">

            <label for="rua">Rua</label>
            <input type="text" id="rua" name="rua">

            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero">

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade">

            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado">

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep">

            <div class="arena-actions">
                <button type="submit">Salvar alterações</button>
                <a href="../../backend/perfil_candidato.php" class="arena-cta arena-cta--outline">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
